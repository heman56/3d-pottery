name: PotteryMaster
options:
  bundleIdPrefix: com.hemanlu
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PotteryMaster:
    type: application
    supportedDestinations: [iOS, macCatalyst]   # iPhone、iPad，以及 Mac 本機（Mac Catalyst）
    sources:
      - Sources
      - path: Resources
        excludes:
          - CREDITS.md
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 製陶大師
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hemanlu.pottery
            UTTypeDescription: 製陶大師作品
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [pottery]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.gltf-binary
            UTTypeDescription: glTF 二進位 3D 模型
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [glb]
              public.mime-type: [model/gltf-binary]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hemanlu.PotteryMaster
        GENERATE_INFOPLIST_FILE: NO
